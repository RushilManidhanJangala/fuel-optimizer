<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fuel Optimizer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin-right: 10px;
      width: 180px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 10px;
      width: 250px;
      background: white;
      border: 2px solid #ddd;
    }

    .best { border-color: green; }
    .cheap { border-color: blue; }
    .fast { border-color: orange; }

    #map {
      height: 300px;
      margin-top: 30px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-weight: bold;
    }

    .options {
      margin-top: 30px;
    }
  </style>
</head>

<body>

<h1>🚗 Fuel Optimizer</h1>

<!-- ✅ FIXED: default values added -->
<input id="start" value="phoenix">
<input id="destination" value="la">
<input id="mpg" value="25">
<input id="gallons" value="10">

<br><br>

<button onclick="getRecommendation()">Get Recommendation</button>

<h2 id="route"></h2>

<div class="cards">
  <div class="card best" id="best"></div>
  <div class="card cheap" id="cheap"></div>
  <div class="card fast" id="fast"></div>
</div>

<!-- Map placeholder -->
<div id="map">
  <h3>🗺 Route Visualization</h3>
  <p id="mapText">Enter locations and click button</p>
</div>

<!-- All options -->
<div class="options">
  <h3>All Options</h3>
  <div id="options"></div>
</div>

<script>
async function getRecommendation() {
  const start = document.getElementById("start").value;
  const destination = document.getElementById("destination").value;

  // ✅ FIX: fallback values
  const mpg = document.getElementById("mpg").value || 25;
  const gallons = document.getElementById("gallons").value || 10;

  const url = `http://127.0.0.1:8000/recommendation?start=${start}&destination=${destination}&mpg=${mpg}&gallons=${gallons}`;

  console.log("Calling API:", url);

  try {
    const res = await fetch(url);

    // ✅ Handle API errors
    if (!res.ok) {
      const errText = await res.text();
      console.error("API Error:", errText);
      alert("API Error: " + res.status);
      return;
    }

    const data = await res.json();
    console.log("DATA:", data);

    // ✅ Route
    document.getElementById("route").innerText =
      `Route: ${data.route.start} → ${data.route.destination}`;

    // ✅ Cards
    document.getElementById("best").innerHTML = `
      ⭐ <b>Best Value</b><br><br>
      ${data.best_value.name}<br>
      Price: $${data.best_value.price}<br>
      Detour: ${data.best_value.detour_miles} mi<br>
      Total: $${data.best_value.total_cost}
    `;

    document.getElementById("cheap").innerHTML = `
      💰 <b>Cheapest</b><br><br>
      ${data.cheapest.name}<br>
      Price: $${data.cheapest.price}<br>
      Detour: ${data.cheapest.detour_miles} mi<br>
      Total: $${data.cheapest.total_cost}
    `;

    document.getElementById("fast").innerHTML = `
      🚗 <b>Most Convenient</b><br><br>
      ${data.most_convenient.name}<br>
      Price: $${data.most_convenient.price}<br>
      Detour: ${data.most_convenient.detour_miles} mi<br>
      Total: $${data.most_convenient.total_cost}
    `;

    // ✅ Map text update (better UX)
    document.getElementById("mapText").innerText =
      `Driving from ${data.route.start} → ${data.route.destination}
Best stop: ${data.best_value.name}
Estimated total cost: $${data.best_value.total_cost}`;

    // ✅ All options list
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    data.all_options.forEach(opt => {
      optionsDiv.innerHTML += `
        <div style="background:white; padding:10px; margin:10px 0;">
          <b>${opt.name}</b><br>
          Price: $${opt.price}<br>
          Detour: ${opt.detour_miles} mi<br>
          Total: $${opt.total_cost}
        </div>
      `;
    });

  } catch (err) {
    console.error("Fetch failed:", err);
    alert("Frontend error. Check console.");
  }
}
</script>

</body>
</html>
