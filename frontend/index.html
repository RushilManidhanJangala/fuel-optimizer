<!DOCTYPE html>
<html>
<head>
    <title>Fuel Optimizer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #333;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            padding: 15px;
            width: 220px;
            border-radius: 10px;
            background-color: white;
        }

        .best {
            border: 2px solid green;
        }

        .cheap {
            border: 2px solid blue;
        }

        .fast {
            border: 2px solid orange;
        }

        .list-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>🚗 Fuel Optimizer</h1>

    <input id="start" placeholder="Start (Phoenix)">
    <input id="destination" placeholder="Destination (LA)">
    <input id="mpg" placeholder="MPG (default 25)">
    <input id="gallons" placeholder="Gallons (default 10)">

    <br><br>

    <button onclick="getRecommendation()">Get Recommendation</button>

    <div id="result"></div>

    <script>
        async function getRecommendation() {
            const start = document.getElementById("start").value;
            const destination = document.getElementById("destination").value;
            const mpg = document.getElementById("mpg").value || 25;
            const gallons = document.getElementById("gallons").value || 10;

            const url = `http://127.0.0.1:8000/recommendation?start=${start}&destination=${destination}&mpg=${mpg}&gallons=${gallons}`;

            const res = await fetch(url);
            const data = await res.json();

            displayResults(data);
        }

        function displayResults(data) {
            const container = document.getElementById("result");

            container.innerHTML = `
                <h2>Route: ${data.route.start} → ${data.route.destination}</h2>

                <div class="cards">
                    ${createCard("⭐ Best Value", data.best_value, "best")}
                    ${createCard("💰 Cheapest", data.cheapest, "cheap")}
                    ${createCard("🚗 Most Convenient", data.most_convenient, "fast")}
                </div>

                <h3 style="margin-top:30px;">All Options</h3>

                ${data.all_options.map(station => `
                    <div class="list-item">
                        <b>${station.name}</b><br>
                        Price: $${station.price}<br>
                        Detour: ${station.detour_miles} mi<br>
                        Total Cost: $${station.total_cost}
                    </div>
                `).join("")}
            `;
        }

        function createCard(title, station, className) {
            return `
                <div class="card ${className}">
                    <h3>${title}</h3>
                    <p><b>${station.name}</b></p>
                    <p>Price: $${station.price}</p>
                    <p>Detour: ${station.detour_miles} mi</p>
                    <p>Total Cost: $${station.total_cost}</p>
                </div>
            `;
        }
    </script>

</body>
</html>
